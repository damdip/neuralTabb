{% extends "base.html" %}

{% block content %}
<h1><i class="fas fa-puzzle-piece"></i> Integrazione Dati</h1>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Integra da File</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">File da Integrare</label>
                        <input type="file" class="form-control" id="file" name="file" accept=".csv,.xlsx,.xls,.json">
                        <small class="form-text text-muted">Supportati: CSV, Excel (.xlsx/.xls), JSON</small>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-upload"></i> Integra File
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Integra da API</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="api_url" class="form-label">URL API</label>
                        <input type="url" class="form-control" id="api_url" name="api_url" placeholder="https://api.example.com/data">
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-download"></i> Integra da API
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
