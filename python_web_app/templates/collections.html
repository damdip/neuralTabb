{% extends 'base.html' %}
{% block title %}Collezioni{% endblock %}
{% block content %}
  <h1>Collezioni</h1>

  <table class="table table-striped">
    <thead>
      <tr><th>Nome</th><th>Count</th><th>Properties</th><th>Vectorizer</th></tr>
    </thead>
    <tbody>
      {% for c in collections %}
        <tr>
          <td>{{ c.name }}</td>
          <td>{{ c.count }}</td>
          <td>{{ c.properties }}</td>
          <td>{{ c.vectorizer }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
